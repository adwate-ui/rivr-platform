# Local Supabase for one worktree. scripts/supabase.mjs copies this file to config.toml
# (gitignored) on every `pnpm supabase`, `pnpm db:*` run, filling in:
#   {{PROJECT_ID}}  the worktree folder name, so each worktree has its own containers
#   {{BLOCK}}       the worktree's port block (CLAUDE.md, "Gotchas"): 543 root, 544-547 lanes A-D, 548 review
# Studio, analytics and the mail catcher are off so four stacks fit in memory.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "{{PROJECT_ID}}"

[api]
enabled = true
port = {{BLOCK}}21
# Never add "private": its security-definer helpers (account_balance, venues_where...) trust
# that only policies, views and other functions call them (docs/decisions/0019).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New tables get no API access until a migration grants it (default deny).
auto_expose_new_tables = false

[db]
port = {{BLOCK}}22
shadow_port = {{BLOCK}}20
major_version = 17

[db.pooler]
enabled = false
port = {{BLOCK}}29

[db.migrations]
enabled = true

[db.seed]
# Local and staging only. Production is never seeded.
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = false
port = {{BLOCK}}23

[local_smtp]
enabled = false
port = {{BLOCK}}24

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:{{BLOCK}}40"
additional_redirect_urls = ["http://127.0.0.1:{{BLOCK}}40", "http://127.0.0.1:{{BLOCK}}41"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Everyone signs in by phone; email sign-up stays off.
[auth.email]
enable_signup = false
enable_confirmations = true

# Local limits. Staging and production set theirs in the dashboard (docs/runbooks/ci-and-release.md).
[auth.captcha]
# Cloudflare Turnstile on every code request (#182). Off locally, where there is no site key; staging
# and production turn it on in the dashboard with the secret (runbook, "Auth and API").
enabled = false
provider = "turnstile"
secret = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.sms]
# Members sign in with a mobile number and a one-time code. Confirmations stay on: without them
# Auth marks a phone confirmed at a password sign-up or a phone change without sending a code.
enable_signup = true
enable_confirmations = true
template = "Your RIVR code is {{ .Code }}"
# A new code for the same phone at most once a minute.
max_frequency = "60s"

# Seed people sign in with code 123456 on local stacks (supabase/seed/10_people.sql).
# Staging sets its own test numbers in the dashboard; production has none.
[auth.sms.test_otp]
919000000101 = "123456"
919000000102 = "123456"
919000000103 = "123456"
919000000104 = "123456"
919000000105 = "123456"
919000000106 = "123456"
919000000107 = "123456"
919000000108 = "123456"
919000000109 = "123456"
919000000110 = "123456"
919000000111 = "123456"
919000000112 = "123456"
919000000113 = "123456"
919000000114 = "123456"
919000000115 = "123456"
919000000116 = "123456"
919000000117 = "123456"
919000000118 = "123456"
919000000119 = "123456"
919000000120 = "123456"
919000000121 = "123456"
919000000122 = "123456"
919000000123 = "123456"
919000000124 = "123456"
919000000125 = "123456"
919000000126 = "123456"
919000000127 = "123456"
919000000128 = "123456"
919000000129 = "123456"
919000000130 = "123456"
919000000131 = "123456"
919000000132 = "123456"
919000000201 = "123456"
919000000202 = "123456"
919000000203 = "123456"
919000000204 = "123456"
919000000209 = "123456"
919000000210 = "123456"
919000000211 = "123456"
919000000213 = "123456"
919000000215 = "123456"
919000000301 = "123456"
919000000302 = "123456"
# Not seeded: the code-only sign-in flow signs this number up with a password (e2e, #187).
919000000901 = "123456"
# Not seeded: the Attribution flow signs this number up (#10).
919000000902 = "123456"
# Not seeded: the Console sign-in flow signs in as someone who is not staff (#223).
919000000903 = "123456"

# Auth refuses phone sign-in without an SMS provider, even for the test numbers above, which
# never reach it. These are placeholders, not credentials; any other number fails locally.
# Every other code goes through the Send SMS hook below.
[auth.sms.twilio]
enabled = true
account_sid = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token = "local-placeholder"

# Auth hands every other code to our function, which sends it by WhatsApp, then SMS
# (supabase/functions/auth-send-code, docs/decisions/0025). With no channel configured, as on a
# local stack, it refuses, so only the test numbers above can sign in locally. The secret is made
# per checkout by scripts/lib/supabase-config.mjs and kept in the gitignored supabase/.hook-secret.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:{{BLOCK}}21/functions/v1/auth-send-code"
secrets = "{{SEND_SMS_HOOK_SECRET}}"

# Tokens only for code sign-ins (#187); a paired device's own login by its password alone (#41).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/require_code_sign_in"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = {{BLOCK}}83
deno_version = 2

[edge_runtime.secrets]
SEND_SMS_HOOK_SECRET = "{{SEND_SMS_HOOK_SECRET}}"
# The player app the kyc function sends DigiLocker back to (#4). Staging and production set it as a
# function secret: https://rivr-player-staging.pages.dev and the production player domain.
PLAYER_APP_URL = "http://127.0.0.1:{{BLOCK}}40"

# verify_jwt on would make the gateway refuse calls without a signed-in person's token. Auth calls
# this function as a service, not as a person, so it is off here; the function's own signature
# check is the guard.
[functions.auth-send-code]
verify_jwt = false

# Called signed out, when Auth refuses a code for the project's hourly limit (#182). It raises at
# most one alert every 15 minutes and takes nothing from the caller.
[functions.sign-in-alert]
verify_jwt = false

# The WhatsApp outbox consumer: pg_cron calls it with the scheduler's secret, not a person's token (#62).
[functions.whatsapp]
verify_jwt = false

# A dealer tablet or TV pairs itself signed out, with the code staff read out (#41); the code is the guard.
[functions.device-pair]
verify_jwt = false

[analytics]
enabled = false
port = {{BLOCK}}27
