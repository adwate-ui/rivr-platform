# Auth refuses phone sign-in without an SMS provider, even for the test numbers above, which
# never reach it. These are placeholders, not credentials; any other number fails locally.
# Every other code goes through the Send SMS hook below.
[auth.sms.twilio]
enabled = true
account_sid = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token = "local-placeholder"

# Auth hands every other code to our function, which sends it by WhatsApp, then SMS
# (supabase/functions/auth-send-code, docs/decisions/0025). With no channel configured, as on a
# local stack, it refuses, so only the test numbers above can sign in locally. The secret is made
# per checkout by scripts/lib/supabase-config.mjs and kept in the gitignored supabase/.hook-secret.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:{{BLOCK}}21/functions/v1/auth-send-code"
secrets = "{{SEND_SMS_HOOK_SECRET}}"

# Tokens only for code sign-ins (#187); a paired device's own login by its password alone (#41).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/require_code_sign_in"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = {{BLOCK}}83
deno_version = 2

[edge_runtime.secrets]
SEND_SMS_HOOK_SECRET = "{{SEND_SMS_HOOK_SECRET}}"
# The player app the kyc function sends DigiLocker back to (#4). Staging and production set it as a
# function secret: https://rivr-player-staging.pages.dev and the production player domain.
PLAYER_APP_URL = "http://127.0.0.1:{{BLOCK}}40"

# verify_jwt on would make the gateway refuse calls without a signed-in person's token. Auth calls
# this function as a service, not as a person, so it is off here; the function's own signature
# check is the guard.
[functions.auth-send-code]
verify_jwt = false

# Called signed out, when Auth refuses a code for the project's hourly limit (#182). It raises at
# most one alert every 15 minutes and takes nothing from the caller.
[functions.sign-in-alert]
verify_jwt = false

# The WhatsApp outbox consumer: pg_cron calls it with the scheduler's secret, not a person's token (#62).
[functions.whatsapp]
verify_jwt = false

# The owner's alerts by WhatsApp (#100); pg_cron calls it with the scheduler's secret (decision 0038).
[functions.alert-whatsapp]
verify_jwt = false

[functions.withdrawal-payout]
verify_jwt = false

# The bank's name for each new UPI payout address (#503); pg_cron calls it with the scheduler's secret.
[functions.payout-name-check]
verify_jwt = false

# A dealer tablet or TV pairs itself signed out, with the code staff read out (#41); the code is the guard.
[functions.device-pair]
verify_jwt = false

# The cage agent (#168, #123): signed out, known by its own token.
[functions.cage-agent]
verify_jwt = false

[analytics]
enabled = false
port = {{BLOCK}}27
