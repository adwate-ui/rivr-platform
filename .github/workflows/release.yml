# A tag release-YYYYMMDD-N deploys the tagged commit to production after the end-to-end
# suite passes on staging, and builds signed APKs for the dealer tablet and driver shells.
# Production is never seeded. Rollback is a Pages rollback plus a forward-fix migration.
# docs/spec/additions-2026-10-14.md, "Environments and release" and "Android builds".
#
# Only a commit on main that staging already runs can be released: "the same commit" passes on
# staging, then goes to production. Production secrets live in the `production` environment,
# which only release-* tags can use and a person must approve (scripts/github/setup-repo.sh).
name: Release

on:
  push:
    tags: ['release-*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag is release-YYYYMMDD-N, N from 1 to 99
        run: '[[ "$GITHUB_REF_NAME" =~ ^release-[0-9]{8}-[1-9][0-9]?$ ]] || { echo "::error::Tag must look like release-20261115-1, N from 1 to 99"; exit 1; }'
      - name: The website knows the production player app
        env:
          PROD_PLAYER_URL: ${{ vars.PROD_PLAYER_URL }}
        run: '[[ "$PROD_PLAYER_URL" =~ ^https://[a-z0-9.-]+/?$ ]] || { echo "::error::Set the repository variable PROD_PLAYER_URL to the player app address, such as https://app.example.com, or the website links nowhere."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag a commit that is on main."; exit 1; }
      - name: Staging runs the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=1" --jq '.[0]')"
          sha="$(jq -r '.sha' <<< "$deployment")"
          state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$(jq -r '.id' <<< "$deployment")/statuses" --jq '.[0].state')"
          if [ "$sha" != "$GITHUB_SHA" ] || [ "$state" != "success" ]; then
            echo "::error::Staging's last deploy is $sha ($state), not $GITHUB_SHA. Tag the commit staging runs once its deploy succeeds."
            exit 1
          fi

  e2e-staging:
    needs: check
    runs-on: ubuntu-latest
    environment: e2e-staging
    timeout-minutes: 45
    env:
      RIVR_E2E_TARGET: staging
      E2E_PLAYER_URL: ${{ vars.STAGING_PLAYER_URL }}
      E2E_CONSOLE_URL: ${{ vars.STAGING_CONSOLE_URL }}
      E2E_TABLET_URL: ${{ vars.STAGING_TABLET_URL }}
      E2E_DISPLAY_URL: ${{ vars.STAGING_DISPLAY_URL }}
      E2E_DRIVER_URL: ${{ vars.STAGING_DRIVER_URL }}
      E2E_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      # The private code staging's test numbers take, for the sign-in flow.
      E2E_SIGN_IN_CODE: ${{ secrets.E2E_SIGN_IN_CODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # No report or trace is uploaded: this repository is public and a staging trace would
      # carry staging sessions. Failures print in the log.
      - run: pnpm e2e

  database:
    needs: e2e-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Migrations (no seed, ever)
        run: |
          pnpm supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions
        run: pnpm supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Device app origins for device-pair (#41)
        env:
          ORIGINS: ${{ vars.PROD_TABLET_URL }}
        run: pnpm supabase secrets set "DEVICE_APP_ORIGINS=$ORIGINS" --project-ref "$PROJECT_REF"
      - name: Auth settings (sessions only from a code, #187)
        run: node scripts/ci/check-auth-config.mjs

  pages:
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.PROD_TURNSTILE_SITE_KEY }}
      PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_PLAYER_URL: ${{ vars.PROD_PLAYER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm build --filter player --filter console --filter display --filter tablet --filter driver --filter web
      - run: node scripts/ci/cloudflare-deploy.mjs production main player console display tablet driver web

  android:
    needs: e2e-staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # The only job that writes: it attaches the APKs to the GitHub release.
    permissions:
      contents: write
    strategy:
      matrix:
        app: [tablet, driver]
    env:
      RIVR_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      RIVR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RIVR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RIVR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The APK is a shell around the hosted, versioned bundle, so code changes need no reinstall.
      RIVR_SHELL_URL: ${{ matrix.app == 'tablet' && vars.PROD_TABLET_URL || vars.PROD_DRIVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RIVR_ANDROID_KEYSTORE_FILE"
      # YYYYMMDD * 100 + N: release-20261115-1 is 2026111501. Always higher than any earlier
      # release, so a tablet never refuses the new APK as a downgrade.
      - name: Version from the tag
        run: |
          date="$(cut -d- -f2 <<< "$GITHUB_REF_NAME")"
          n="$(cut -d- -f3 <<< "$GITHUB_REF_NAME")"
          echo "RIVR_VERSION_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "RIVR_VERSION_CODE=$(( 10#$date * 100 + 10#$n ))" >> "$GITHUB_ENV"
      - run: pnpm build --filter ${{ matrix.app }}
      - run: pnpm --filter ${{ matrix.app }} exec cap sync android
      - run: ./gradlew assembleRelease
        working-directory: apps/${{ matrix.app }}/android
      - run: cp apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk "rivr-${{ matrix.app }}-${GITHUB_REF_NAME}.apk"
      # The key leaves the disk before any third-party action runs; always(), so a failed build removes it too.
      - if: always()
        run: rm -f "$RIVR_ANDROID_KEYSTORE_FILE"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: rivr-${{ matrix.app }}-${{ github.ref_name }}.apk
