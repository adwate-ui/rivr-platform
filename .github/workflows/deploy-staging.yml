# Every merge to main deploys to rivr-staging: migrations and seed, Edge Functions, every
# web surface (including the tablet and driver bundles) and Storybook, the published design
# system. docs/spec/additions-2026-10-14.md, "Environments and release".
# Secrets come from the `staging` environment, which only main can use. Each job records a
# GitHub deployment of this commit; a release checks that staging runs the commit it tags.
name: Deploy staging

on:
  push:
    branches: [main]
  # "Run workflow" on main redeploys staging, for example after its secrets are first added.
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_STAGING_REF != '' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_STAGING_REF }}
    steps:
      - if: env.HAS_SUPABASE != 'true'
        run: echo "::notice::Supabase staging secrets are not set; skipping the database deploy."
      - if: env.HAS_SUPABASE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.HAS_SUPABASE == 'true'
        uses: ./.github/actions/setup
      - if: env.HAS_SUPABASE == 'true'
        name: Migrations and seed
        run: |
          pnpm supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
      - if: env.HAS_SUPABASE == 'true'
        name: Edge Functions
        run: pnpm supabase functions deploy --project-ref "$PROJECT_REF"
      - if: env.HAS_SUPABASE == 'true'
        name: Device app origins for device-pair (#41)
        env:
          ORIGINS: ${{ vars.STAGING_TABLET_URL }},${{ vars.STAGING_DISPLAY_URL }}
        run: pnpm supabase secrets set "DEVICE_APP_ORIGINS=$ORIGINS" --project-ref "$PROJECT_REF"
      - if: env.HAS_SUPABASE == 'true'
        name: Auth settings (sessions only from a code, #187)
        run: node scripts/ci/check-auth-config.mjs --warn

  pages:
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
      PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_PLAYER_URL: ${{ vars.STAGING_PLAYER_URL }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Pages deploy."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: ./.github/actions/setup
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm build --filter player --filter console --filter display --filter tablet --filter driver --filter web
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @rivr/ui build-storybook
      - if: env.HAS_CLOUDFLARE == 'true'
        run: node scripts/ci/cloudflare-deploy.mjs staging main player console display tablet driver web storybook
