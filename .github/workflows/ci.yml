# Runs on every pull request and every push to main. Branch protection requires all four
# jobs plus the `agent-review` status, posted once the review subagents pass (decision 0024).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # Typecheck, lint, unit, property and mutation tests, pgTAP, generated tokens,
      # drill gates, Storybook build and visual tests, for every package. On a pull request,
      # mutation tests cover the money modules it changes; the push to main covers them all (decision 0242).
      - run: pnpm verify:all
        env:
          MUTATION_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-reports
          path: |
            packages/ui/visual/test-results/
            packages/domain/reports/
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm db:start
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm build --filter player
      # Player initial JavaScript under 200 KB gzipped (additions, "Performance budgets").
      - run: node scripts/check-bundle.mjs

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm db:start
      - name: Database lint
        run: pnpm supabase db lint --local --level warning --fail-on warning
      - name: Supabase security advisors
        run: bash scripts/ci/security-advisors.sh
      - name: Nightly backup against the local stack, as its read-only role (#25)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq age postgresql-client-17
          PATH="/usr/lib/postgresql/17/bin:$PATH" bash scripts/backup/check-backup.sh
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret scanning
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
