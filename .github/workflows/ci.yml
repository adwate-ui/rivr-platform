# Runs on every pull request and every push to main, as parallel jobs (decision 0243). Branch protection on main
# requires only `ci-ok`, which passes when every job below passed, and the `agent-review` status (decision 0024);
# a pull request must also be up to date with main. A new or split job goes into ci-ok's `needs`, never into branch
# protection. Each timeout is near twice the job's usual time, so a hang fails fast. CI restores no build cache:
# a green run is a result from scratch.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Typecheck, lint, unit and property tests for every package; root and e2e lint, Edge Function import maps,
  # migration versions, dependency rules, stylesheets, generated tokens and the drill gates. Chromium is for
  # @rivr/render's tests, which draw in a real browser.
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: node scripts/verify.mjs code

  # pgTAP against the migrations and seed, and the generated database types.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/verify.mjs database

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: node scripts/verify.mjs storybook
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-results
          path: packages/ui/visual/test-results/
          if-no-files-found: ignore

  # Mutation tests (decision 0242): on a pull request the money modules it changes, on a push to main every one,
  # split four ways so no runner carries them all.
  mutation:
    name: mutation ${{ matrix.share }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        share: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/verify.mjs mutation ${{ matrix.share }}
        env:
          MUTATION_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-reports-${{ strategy.job-index }}
          path: packages/domain/reports/
          if-no-files-found: ignore

  # The Playwright flows against a seeded local stack, a third on each of three runners, each with its own stack.
  e2e:
    name: e2e ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm db:start
      - run: pnpm build
      - run: pnpm e2e --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          if-no-files-found: ignore

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm build --filter player
      # Player initial JavaScript under 200 KB gzipped (additions, "Performance budgets").
      - run: node scripts/check-bundle.mjs

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm db:start
      - name: Database lint
        run: pnpm supabase db lint --local --level warning --fail-on warning
      - name: Supabase security advisors
        run: bash scripts/ci/security-advisors.sh
      - name: Nightly backup against the local stack, as its read-only role (#25)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq age postgresql-client-17
          PATH="/usr/lib/postgresql/17/bin:$PATH" bash scripts/backup/check-backup.sh
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret scanning
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  # The one check branch protection requires: every job above passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [code, database, storybook, mutation, e2e, budgets, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
