name: Set up the workspace
description: Node from .node-version, pnpm from package.json, and a frozen-lockfile install.
inputs:
  playwright:
    description: Also install Chromium and its system libraries for Playwright.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.playwright == 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
