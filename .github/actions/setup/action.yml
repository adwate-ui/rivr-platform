name: Set up the workspace
description: Node from .node-version, pnpm from package.json, and a frozen-lockfile install.
inputs:
  playwright:
    description: Also install Chromium for Playwright.
    default: 'false'
runs:
  using: composite
  steps:
    # The local stack and the apps serve on 543xx (portBlock in @rivr/config/worktree), inside Linux's ephemeral range
    # (32768-60999). An outgoing connection that happened to be given 54340 kept vite preview off it, and 54322 the
    # database; reserved, those ports are never handed out to a connection.
    - run: sudo sysctl -q -w net.ipv4.ip_local_reserved_ports=54300-54399
      shell: bash
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Without --with-deps: the runner already has Chromium's libraries, and Azure's Ubuntu mirror sometimes stalls for
    # ten minutes on them (#525). Screenshots are taken in Playwright's container, which brings its own.
    - if: inputs.playwright == 'true'
      run: pnpm exec playwright install chromium
      shell: bash
