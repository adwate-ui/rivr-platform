name: Set up the workspace
description: Node from .node-version, pnpm from package.json, and a frozen-lockfile install.
inputs:
  playwright:
    description: Also install Chromium for Playwright.
    default: 'false'
  playwright-system-deps:
    description: >-
      Also apt-install Chromium's system packages and fonts. Only screenshot comparisons need them (the storybook
      job's visual check): the runner already has Chromium's libraries, and Azure's Ubuntu mirror sometimes stalls
      for ten minutes on these packages (#525).
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.playwright == 'true' && inputs.playwright-system-deps == 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - if: inputs.playwright == 'true' && inputs.playwright-system-deps != 'true'
      run: pnpm exec playwright install chromium
      shell: bash
